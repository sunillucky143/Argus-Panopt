x-app-profile: &app-profile
  profiles: ["cpu", "gpu"]

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  init: true

services:
  api:
    <<: [*app-profile, *hardened]
    build:
      context: ../backend
      args:
        APP_VERSION: ${ARGUS_APP_VERSION:-0.1.0}
    environment:
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-development}
      ARGUS_APP_VERSION: ${ARGUS_APP_VERSION:-0.1.0}
      ARGUS_LOG_LEVEL: ${ARGUS_LOG_LEVEL:-INFO}
      ARGUS_CORS_ORIGINS: ${ARGUS_CORS_ORIGINS:-http://localhost:8080}
      ARGUS_DEBUG_INFERENCE_ENABLED: ${ARGUS_DEBUG_INFERENCE_ENABLED:-false}
      ARGUS_MODEL_PROVIDER: ${ARGUS_MODEL_PROVIDER:-fake}
      ARGUS_MODEL_NAME: ${ARGUS_MODEL_NAME:-argus-smoke-model}
      ARGUS_MODEL_ENDPOINT: ${ARGUS_MODEL_ENDPOINT:-http://inference-cpu:8080/v1}
      ARGUS_MODEL_CONTEXT_CEILING: ${ARGUS_MODEL_CONTEXT_CEILING:-32768}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - processing
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001
    cpus: ${ARGUS_API_CPUS:-1.0}
    mem_limit: ${ARGUS_API_MEMORY:-768m}
    pids_limit: 128

  web:
    <<: [*app-profile, *hardened]
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ARGUS_WEB_PORT:-8080}:8080"
    networks:
      - edge
      - processing
    tmpfs:
      - /tmp:size=16m,mode=1770,uid=101,gid=101
      - /var/cache/nginx:size=32m,mode=1770,uid=101,gid=101
      - /var/run:size=8m,mode=1770,uid=101,gid=101
    cpus: ${ARGUS_WEB_CPUS:-0.5}
    mem_limit: ${ARGUS_WEB_MEMORY:-128m}
    pids_limit: 64

  postgres:
    <<: *app-profile
    image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - processing
    tmpfs:
      - /tmp:size=64m,mode=1770
      - /run/postgresql:size=16m,mode=2775,uid=999,gid=999
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: ${ARGUS_POSTGRES_CPUS:-1.0}
    mem_limit: ${ARGUS_POSTGRES_MEMORY:-1g}
    pids_limit: 128

  redis:
    <<: [*app-profile, *hardened]
    image: redis:7.4.6-alpine3.21@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - processing
    tmpfs:
      - /tmp:size=16m,mode=1770
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    cpus: ${ARGUS_REDIS_CPUS:-0.5}
    mem_limit: ${ARGUS_REDIS_MEMORY:-256m}
    pids_limit: 64

networks:
  edge:
    driver: bridge
  processing:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
