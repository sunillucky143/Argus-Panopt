x-app-profile: &app-profile
  profiles: ["cpu", "gpu", "smoke"]

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  init: true

services:
  api:
    <<: [*app-profile, *hardened]
    build:
      context: ../backend
      args:
        APP_VERSION: ${ARGUS_APP_VERSION:-0.1.0}
    environment:
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-development}
      ARGUS_APP_VERSION: ${ARGUS_APP_VERSION:-0.1.0}
      ARGUS_LOG_LEVEL: ${ARGUS_LOG_LEVEL:-INFO}
      ARGUS_CORS_ORIGINS: ${ARGUS_CORS_ORIGINS:-http://localhost:8080}
      ARGUS_DEBUG_INFERENCE_ENABLED: ${ARGUS_DEBUG_INFERENCE_ENABLED:-false}
      ARGUS_INFERENCE_METRICS_ENABLED: ${ARGUS_INFERENCE_METRICS_ENABLED:-true}
      ARGUS_MODEL_PROVIDER: ${ARGUS_MODEL_PROVIDER:-llama_cpp}
      ARGUS_MODEL_NAME: ${ARGUS_MODEL_NAME:-gemma-3-4b-it}
      ARGUS_MODEL_ENDPOINT: ${ARGUS_MODEL_ENDPOINT:-http://inference-cpu:8080/v1}
      ARGUS_MODEL_CONTEXT_CEILING: ${ARGUS_MODEL_CONTEXT_CEILING:-32768}
      ARGUS_EMBEDDING_ENDPOINT: ${ARGUS_EMBEDDING_ENDPOINT:-http://embedding-service:8081}
      ARGUS_EMBEDDING_MODEL: ${ARGUS_EMBEDDING_MODEL:-bge-m3}
      ARGUS_RERANKER_MODEL: ${ARGUS_RERANKER_MODEL:-bge-reranker-v2-m3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - processing
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001
    cpus: ${ARGUS_API_CPUS:-1.0}
    mem_limit: ${ARGUS_API_MEMORY:-768m}
    pids_limit: 128

  web:
    <<: [*app-profile, *hardened]
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ARGUS_WEB_PORT:-8080}:8080"
    networks:
      - edge
      - processing
    tmpfs:
      - /tmp:size=16m,mode=1770,uid=101,gid=101
      - /var/cache/nginx:size=32m,mode=1770,uid=101,gid=101
      - /var/run:size=8m,mode=1770,uid=101,gid=101
    cpus: ${ARGUS_WEB_CPUS:-0.5}
    mem_limit: ${ARGUS_WEB_MEMORY:-128m}
    pids_limit: 64

  postgres:
    <<: *app-profile
    image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - processing
    tmpfs:
      - /tmp:size=64m,mode=1770
      - /run/postgresql:size=16m,mode=2775,uid=999,gid=999
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: ${ARGUS_POSTGRES_CPUS:-1.0}
    mem_limit: ${ARGUS_POSTGRES_MEMORY:-1g}
    pids_limit: 128

  redis:
    <<: [*app-profile, *hardened]
    image: redis:7.4.6-alpine3.21@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - processing
    tmpfs:
      - /tmp:size=16m,mode=1770
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    cpus: ${ARGUS_REDIS_CPUS:-0.5}
    mem_limit: ${ARGUS_REDIS_MEMORY:-256m}
    pids_limit: 64

  inference-cpu:
    <<: *hardened
    profiles: ["cpu"]
    image: ghcr.io/ggml-org/llama.cpp:server-b9445@sha256:8dd148c53936b6e8b0e75309841e66eab13adc50b004a5e86ab1fec477c17d8e
    user: "10001:10001"
    command:
      - --model
      - /models/gemma-3-4b-it-Q4_K_M.gguf
      - --alias
      - ${ARGUS_MODEL_NAME:-gemma-3-4b-it}
      - --ctx-size
      - ${ARGUS_MODEL_CONTEXT_CEILING:-32768}
      - --threads
      - ${ARGUS_LLAMA_THREADS:-8}
      - --parallel
      - ${ARGUS_LLAMA_PARALLEL:-1}
      - --metrics
      - --no-ui
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      HOME: /tmp
    volumes:
      - type: bind
        source: ../models
        target: /models
        read_only: true
    networks:
      - processing
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    stop_grace_period: 30s
    cpus: ${ARGUS_LLAMA_CPUS:-6.0}
    mem_limit: ${ARGUS_LLAMA_MEMORY:-8g}
    pids_limit: 512

  inference-gpu:
    <<: *hardened
    profiles: ["gpu"]
    platform: linux/amd64
    image: vllm/vllm-openai:v0.26.0-x86_64-cu129-ubuntu2404@sha256:4d08193d2fd05aadb1b5678f93ae609efb2635df67da45f3efe781c368b34dc8
    user: "10001:10001"
    command:
      - --model
      - /models/model
      - --served-model-name
      - ${ARGUS_MODEL_NAME:-qwen2.5-vl-7b-instruct-awq}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --quantization
      - awq
      - --max-model-len
      - ${ARGUS_MODEL_CONTEXT_CEILING:-65536}
      - --kv-cache-dtype
      - fp8
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"ngram","num_speculative_tokens":4,"prompt_lookup_min":2,"prompt_lookup_max":5}'
      - --gpu-memory-utilization
      - ${ARGUS_VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${ARGUS_VLLM_MAX_NUM_SEQS:-30}
      - --limit-mm-per-prompt
      - '{"image":8,"video":0}'
      - --no-enable-log-requests
      - --no-enable-log-outputs
      - --disable-uvicorn-access-log
      - --disable-fastapi-docs
    environment:
      HOME: /tmp
      HF_HOME: /tmp/huggingface
      HF_HUB_CACHE: /tmp/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - type: bind
        source: ../models/qwen2.5-vl-7b-instruct-awq-536a357
        target: /models/model
        read_only: true
    networks:
      - processing
    tmpfs:
      - /tmp:size=2g,mode=1770,uid=10001,gid=10001
    shm_size: 4gb
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    stop_grace_period: 60s
    cpus: ${ARGUS_VLLM_CPUS:-8.0}
    mem_limit: ${ARGUS_VLLM_MEMORY:-16g}
    pids_limit: 1024
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  embedding-service:
    <<: *hardened
    profiles: ["cpu", "gpu"]
    build:
      context: ../embedding-service
    user: "10001:10001"
    environment:
      ARGUS_RETRIEVAL_EMBEDDING_ENGINE_ENDPOINT: http://embedding-engine:80
      ARGUS_RETRIEVAL_RERANKER_ENGINE_ENDPOINT: http://reranker-engine:80
      ARGUS_RETRIEVAL_EMBEDDING_MODEL: ${ARGUS_EMBEDDING_MODEL:-bge-m3}
      ARGUS_RETRIEVAL_RERANKER_MODEL: ${ARGUS_RERANKER_MODEL:-bge-reranker-v2-m3}
      ARGUS_RETRIEVAL_TIMEOUT_SECONDS: ${ARGUS_RETRIEVAL_TIMEOUT_SECONDS:-120}
    depends_on:
      embedding-engine:
        condition: service_healthy
      reranker-engine:
        condition: service_healthy
    networks:
      - processing
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=10001,gid=10001
    cpus: ${ARGUS_RETRIEVAL_GATEWAY_CPUS:-0.5}
    mem_limit: ${ARGUS_RETRIEVAL_GATEWAY_MEMORY:-256m}
    pids_limit: 64

  embedding-engine:
    <<: *hardened
    profiles: ["cpu", "gpu"]
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.1@sha256:b7772cdd9dcbced147b16a7dff17d4aed1ab36333f8d3e686c50d2175e1d2126
    user: "10001:10001"
    command:
      - --model-id
      - /models/model
      - --port
      - "80"
      - --dtype
      - float32
      - --pooling
      - cls
      - --max-client-batch-size
      - "256"
      - --max-batch-tokens
      - "16384"
      - --auto-truncate
    environment:
      HOME: /tmp
      HF_HOME: /tmp/huggingface
      HF_HUB_CACHE: /tmp/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAYON_NUM_THREADS: ${ARGUS_EMBEDDING_THREADS:-4}
    volumes:
      - type: bind
        source: ../models/bge-m3-onnx-fp32-5617a9f
        target: /models/model
        read_only: true
    networks:
      - processing
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    stop_grace_period: 30s
    cpus: ${ARGUS_EMBEDDING_CPUS:-2.0}
    mem_limit: ${ARGUS_EMBEDDING_MEMORY:-4g}
    pids_limit: 256

  reranker-engine:
    <<: *hardened
    profiles: ["cpu", "gpu"]
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.1@sha256:b7772cdd9dcbced147b16a7dff17d4aed1ab36333f8d3e686c50d2175e1d2126
    user: "10001:10001"
    command:
      - --model-id
      - /models/model
      - --port
      - "80"
      - --dtype
      - float32
      - --max-client-batch-size
      - "256"
      - --max-batch-tokens
      - "16384"
      - --auto-truncate
    environment:
      HOME: /tmp
      HF_HOME: /tmp/huggingface
      HF_HUB_CACHE: /tmp/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAYON_NUM_THREADS: ${ARGUS_RERANKER_THREADS:-4}
    volumes:
      - type: bind
        source: ../models/bge-reranker-v2-m3-safetensors-fp32-953dc6f
        target: /models/model
        read_only: true
    networks:
      - processing
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    stop_grace_period: 30s
    cpus: ${ARGUS_RERANKER_CPUS:-2.0}
    mem_limit: ${ARGUS_RERANKER_MEMORY:-4g}
    pids_limit: 256

networks:
  edge:
    driver: bridge
  processing:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
